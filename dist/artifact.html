<style>
/* Layout: consola de ecógrafo — fondo de sala oscura, texto de calibrador ámbar, Doppler rojo/azul solo para estado. Columna única de lectura, rejillas que se apilan en móvil. */
:root {
  --bg: #0c1114;
  --panel: #131a1f;
  --panel-2: #1a2329;
  --line: #27333b;
  --fg: #e4eaed;
  --muted: #8d9ea8;
  --accent: #f0b84a;
  --accent-ink: #1b1305;
  --accent-soft: rgba(240, 184, 74, 0.14);
  --ok: #4cc38a;
  --ok-soft: rgba(76, 195, 138, 0.14);
  --bad: #ef6a5f;
  --bad-soft: rgba(239, 106, 95, 0.14);
  --dop-r: #e5484d;
  --dop-b: #3e8ef7;
  --scan-bg: #05080a;
  --f-disp: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-text: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2f4; --panel: #ffffff; --panel-2: #e5ebee; --line: #cfd8de;
    --fg: #13212a; --muted: #566873; --accent: #a8700c; --accent-ink: #ffffff;
    --accent-soft: rgba(168, 112, 12, 0.12); --ok: #1c8a55; --ok-soft: rgba(28, 138, 85, 0.12);
    --bad: #c23b33; --bad-soft: rgba(194, 59, 51, 0.10); --dop-r: #c8303a; --dop-b: #2a6fd6;
    --scan-bg: #0b1013; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2f4; --panel: #ffffff; --panel-2: #e5ebee; --line: #cfd8de;
  --fg: #13212a; --muted: #566873; --accent: #a8700c; --accent-ink: #ffffff;
  --accent-soft: rgba(168, 112, 12, 0.12); --ok: #1c8a55; --ok-soft: rgba(28, 138, 85, 0.12);
  --bad: #c23b33; --bad-soft: rgba(194, 59, 51, 0.10); --dop-r: #c8303a; --dop-b: #2a6fd6;
  --scan-bg: #0b1013; color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 1.0625rem/1.55 var(--f-text);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); }
h2 { font-size: clamp(1.5rem, 4vw, 1.9rem); }
h3 { font-size: 1.3rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; font: 700 1.5rem/1 var(--f-disp); letter-spacing: 0.02em; }
.nav { display: flex; gap: 4px; overflow-x: auto; margin-left: auto; scrollbar-width: none; }
.nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; white-space: nowrap; font-weight: 600; font-size: 0.98rem; display: inline-flex; gap: 6px; align-items: center; }
.nav a:hover { color: var(--fg); background: var(--panel-2); }
.nav a.on { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--accent); }
.badge { font: 600 0.72rem/1 var(--f-mono); background: var(--accent); color: var(--accent-ink); padding: 3px 6px; border-radius: 99px; }

main.wrap { padding-block: 22px 40px; display: grid; gap: 28px; }
.pie { color: var(--muted); font-size: 0.85rem; padding-block: 0 32px; }

/* Utilidades */
.eyebrow { font: 600 0.75rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 0.95rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

select, input[type="search"], input[type="text"], textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-height: 44px; max-width: 100%;
}
textarea { width: 100%; min-height: 90px; resize: vertical; line-height: 1.45; }

/* Portada */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.hero .stack { gap: 12px; }
.hero p.lead { color: var(--muted); max-width: 60ch; }
.scan { position: relative; background: var(--scan-bg); border-radius: var(--r); border: 1px solid var(--line); aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; }
.scan canvas { width: 100%; height: 100%; display: block; }
.scan .hud { position: absolute; font: 400 0.7rem/1.3 var(--f-mono); color: #c9d3d8; opacity: 0.85; pointer-events: none; }
.scan .hud.tl { top: 8px; left: 10px; }
.scan .hud.tr { top: 8px; right: 10px; text-align: right; }
.scan .hud.bl { bottom: 8px; left: 10px; color: #f0b84a; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.kpi b { font: 700 1.9rem/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 0.88rem; }

/* Cursos */
.cursos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.curso { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; text-decoration: none; color: inherit; align-content: start; }
.curso:hover { border-color: var(--muted); }
.curso .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.curso h3 { font-size: 1.45rem; }
.pct { font: 700 1.6rem/1 var(--f-disp); color: var(--accent); font-variant-numeric: tabular-nums; }
.curso .sub { color: var(--muted); font-size: 0.92rem; }

/* Barras de criterios (estilo TGC) */
.tgc { display: grid; gap: 7px; }
.tgc .l { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 2.6rem; gap: 8px; align-items: center; font-size: 0.85rem; }
.tgc .w { font: 600 0.78rem/1 var(--f-mono); color: var(--muted); }
.tgc .v { font: 600 0.78rem/1 var(--f-mono); text-align: right; }
.bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.bar.ok i { background: var(--ok); }

/* Vista curso */
.chead { display: grid; gap: 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs a { padding: 10px 12px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--fg); border-color: var(--accent); }
.tabs a:hover { color: var(--fg); }

.crit { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.crit > header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.peso { font: 700 1.5rem/1 var(--f-disp); color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.2rem; }
.peso small { display: block; font: 600 0.62rem/1.2 var(--f-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.crit header p { font-size: 0.95rem; color: var(--muted); }
.crit header h3 { font-size: 1.2rem; }
.dom { font: 600 0.8rem/1 var(--f-mono); color: var(--muted); text-align: right; white-space: nowrap; }

details.tema { border-top: 1px solid var(--line); }
details.tema:first-of-type { border-top: 0; }
details.tema > summary { cursor: pointer; padding: 13px 16px; list-style: none; display: flex; gap: 10px; align-items: center; font-weight: 600; }
details.tema > summary::-webkit-details-marker { display: none; }
details.tema > summary::before { content: "+"; font: 600 1rem/1 var(--f-mono); color: var(--accent); width: 1rem; flex: none; }
details.tema[open] > summary::before { content: "−"; }
details.tema > summary .chk { margin-left: auto; font: 600 0.72rem/1 var(--f-mono); color: var(--ok); white-space: nowrap; }
.tema-body { padding: 0 16px 18px; display: grid; gap: 12px; max-width: 72ch; min-width: 0; }
.tema-body ul, .tema-body ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 5px; }
.tema-body h4 { font-size: 1.12rem; color: var(--accent); margin-top: 4px; }
.tema-body table { border-collapse: collapse; font-size: 0.93rem; min-width: 420px; }
.tema-body th, .tema-body td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; text-align: left; vertical-align: top; }
.tema-body th { font: 600 0.75rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tabla { overflow-x: auto; max-width: 100%; }
.perla { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 0.97rem; }
.perla b:first-child { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }
.fuente { font-size: 0.82rem; color: var(--muted); font-style: italic; }
.fig { background: var(--panel-2); border-radius: 8px; padding: 12px; overflow-x: auto; }
.fig svg { display: block; max-width: 100%; height: auto; }
.fig figcaption { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
figure { margin: 0; }
.notas label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }

/* Tarjetas */
.fc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; min-height: 260px; display: grid; gap: 16px; align-content: start; }
.fc .q { font-size: 1.22rem; font-weight: 600; line-height: 1.4; }
.fc .a { font-size: 1.08rem; border-top: 1px dashed var(--line); padding-top: 14px; }
.fc .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades .btn { flex-direction: column; gap: 2px; padding: 8px 6px; }
.grades .btn small { font: 400 0.72rem/1 var(--f-mono); color: var(--muted); }
.grades .g0 { border-color: var(--bad); }
.grades .g3 { border-color: var(--ok); }
.progreso { font: 600 0.8rem/1 var(--f-mono); color: var(--muted); }

/* Preguntas */
.qbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.qbox .enun { font-size: 1.12rem; font-weight: 600; line-height: 1.45; }
.caso-tag { display: inline-block; font: 600 0.7rem/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dop-b); border: 1px solid currentColor; padding: 4px 7px; border-radius: 5px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 11px 14px; cursor: pointer; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 8px; line-height: 1.4; min-height: 44px; }
.opt .k { font: 600 0.85rem/1.5 var(--f-mono); color: var(--muted); }
.opt:hover:not([disabled]) { border-color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.expl { border-left: 3px solid var(--ok); padding: 8px 12px; background: var(--panel-2); border-radius: 0 8px 8px 0; font-size: 0.98rem; }
.expl.mal { border-left-color: var(--bad); }
.res { display: grid; gap: 10px; }
.nota { font: 700 3.4rem/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.nota small { font-size: 1.3rem; color: var(--muted); }
.revision { display: grid; gap: 10px; }
.revision .it { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; gap: 6px; background: var(--panel); font-size: 0.97rem; }
.revision .it.mal { border-left: 3px solid var(--bad); }
.revision .it.bien { border-left: 3px solid var(--ok); }

/* Filtros */
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filtros label { font-size: 0.9rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }

/* Glosario */
.glos { display: grid; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.glos .g { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 4px 16px; padding: 11px 16px; border-top: 1px solid var(--line); }
.glos .g:first-child { border-top: 0; }
.glos dt { font-weight: 700; }
.glos dt small { display: block; font: 400 0.7rem/1.4 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.glos dd { margin: 0; color: var(--fg); }

/* Biblioteca */
.libros { display: grid; gap: 10px; }
.libro { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.libro:first-child { border-top: 0; }
.libro .lomo { width: 2.4rem; height: 3.2rem; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); border-left: 5px solid var(--accent); }
.vacio { border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); display: grid; gap: 8px; }

@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero .scan { order: -1; aspect-ratio: 16 / 9; }
  .cursos { grid-template-columns: minmax(0, 1fr); }
  .glos .g { grid-template-columns: minmax(0, 1fr); }
  .crit > header { grid-template-columns: auto minmax(0, 1fr); }
  .crit > header .dom { grid-column: 2; text-align: left; }
  .nav { margin-left: 0; width: 100%; }
}
@media (max-width: 420px) {
  .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .kpis .kpi:last-child { grid-column: span 2; }
  .grades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width 0.5s ease; }
  .fc, .qbox { animation: entra 0.18s ease-out; }
  @keyframes entra { from { transform: translateY(4px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>

<footer class="pie wrap">Material de estudio personal. Contenido de referencia general; se ampliará con los libros del curso.</footer>
<script>
/* Registro de contenido de Sonoaula.
   Cada archivo de curso llama a ECO.curso({...}). Formato:
   {
     id: 'bases',                 // identificador corto, sin guiones
     codigo, titulo, corto, resumen,
     criterios: [{ id, peso, pesoEstimado?, titulo, descripcion, temas: [{ titulo, html, fuente? }] }],
     tarjetas:  [[criterioId, 'pregunta (frente)', 'respuesta (reverso)'], ...],
     preguntas: [{ c: criterioId, q: 'enunciado', o: ['A','B','C','D'], a: índiceCorrecto, e: 'explicación', caso?: true }],
     glosario:  [['Término', 'definición'], ...],
     tarjetas pueden llevar un 4.º elemento con la fuente; preguntas, el campo f: 'Bates, cap. 3, p. 60'
   }
   El progreso de cada tarjeta/pregunta se asocia al texto del frente/enunciado:
   si se corrige una errata, esa tarjeta reinicia su progreso. */
window.ECO = window.ECO || { cursos: [] };
window.ECO.curso = function (c) { window.ECO.cursos.push(c); };
/* Libros del curso (fuente principal del contenido). Las citas usan las claves cortas «Bates» y «ABC». */
window.ECO.libros = [
  { id: 'bates', corto: 'Bates', titulo: 'Ecografía abdominal: cómo, por qué y cuándo (3.ª ed.)', autor: 'Jane Bates · Elsevier España, 2012', detalle: '11 capítulos: optimización y seguridad, hepatobiliar, páncreas, bazo y linfático, vías renales, retroperitoneo y tubo digestivo, pediatría, abdomen agudo e intervencionismo.' },
  { id: 'abc', corto: 'ABC', titulo: 'El ABC de la ecografía abdominal (1.ª ed.)', autor: 'Dr. Lorenz Rodríguez · RayosPedia', detalle: 'Generalidades, hígado y vía biliar, páncreas, bazo, riñón y vejiga, tubo digestivo, próstata y ginecología.' }
];
window.ECO.referencias = [
  { titulo: 'Diagnóstico por ecografía', autor: 'Rumack, Wilson, Charboneau, Levine', uso: 'Tratado de referencia: abdomen, retroperitoneo, vasos, pediatría.' },
  { titulo: 'Sonography Principles and Instruments', autor: 'Frederick W. Kremkau', uso: 'Física del ultrasonido, transductores, Doppler, artefactos y bioefectos.' },
  { titulo: 'Textbook of Diagnostic Sonography', autor: 'Sandra L. Hagen-Ansert', uso: 'Técnica de exploración por órgano, anatomía y patrones ecográficos.' },
  { titulo: 'Ecografía (serie Radiología Clínica: los requisitos)', autor: 'Middleton, Kurtz, Hertzberg', uso: 'Síntesis práctica de patología abdominal para repaso.' },
  { titulo: 'Ecografía abdominal', autor: 'Matthias Hofer', uso: 'Manual de técnica paso a paso, planos estándar y medidas normales.' }
];
</script>
<script>
ECO.curso({
  id: 'bases',
  codigo: '520092C',
  titulo: 'Bases Generales en Ecografía',
  corto: 'Bases',
  resumen: 'Terminología, física del ultrasonido, manejo y optimización del equipo, transductores, seguridad y aplicaciones clínicas.',
  criterios: [
    {
      id: 'b1', peso: 25, titulo: 'Términos y conceptos básicos',
      descripcion: 'Describe los términos y conceptos básicos relacionados con la ecografía.',
      temas: [
        {
          titulo: 'Ecogenicidad: el lenguaje del blanco y negro',

<p><b>Cuidados</b>: un transductor con grietas en el revestimiento se retira del servicio; limpieza según el fabricante; funda estéril en heridas abiertas, inmunodeprimidos y procedimientos.</p>`

<tr><td>No invasiva, sin radiación ionizante: segura incluso en embarazadas</td><td>Gas abdominal abundante</td></tr>

</tbody></table></div>
<h4>¿Qué se evalúa en una ecografía abdominal? (ABC)</h4>
<p>Hígado, vesícula, bazo, páncreas, riñones, aorta y VCI, <b>y también la pelvis</b> (vejiga, útero, ovarios, próstata): una mujer joven con dolor abdominal e irritación peritoneal puede tener un quiste ovárico roto o un <b>embarazo ectópico</b>. Además se busca <b>líquido libre</b> y se explora el retroperitoneo (adenopatías, masas).</p>
<p><b>No incluye</b> la pared abdominal (requiere transductor lineal: ecografía de partes blandas para hernias). El <b>tubo digestivo</b> lleno de gas no se valora bien, aunque pueden verse tumores grandes o asas dilatadas con líquido en la obstrucción.</p>
<h4>Indicaciones</h4>
<p>Cuadros agudos: colecistitis, apendicitis, cólico renal, traumatismos, abdomen agudo. No agudos: cirrosis, hepatitis, absceso hepático, tumores.</p>
<p>Bates insiste: la única práctica aceptable es tras formación teórica y práctica adecuada, con supervisión, actualización continua y auditoría. Conocer las propias limitaciones y pedir ayuda es una de las lecciones más valiosas.</p>`

        {
          titulo: 'Abdomen agudo y FAST',
          fuente: 'Bates, cap. 10, pp. 297–305',
          html: `
<p>La ecografía es decisiva en la evaluación inicial del abdomen agudo: como diagnóstico definitivo (colecistitis en el dolor del cuadrante superior derecho) o como herramienta de <b>priorización</b>. En el politraumatismo múltiple la TC suele ser de primera elección porque ve hueso, columna y retroperitoneo, sopesando el riesgo de radiación.</p>
<h4>FAST</h4>
<ul>
<li>Mínimo <b>cuatro ventanas</b>: flanco derecho (espacio hepatorrenal), flanco izquierdo (periesplénico, por encima y debajo del diafragma), subcostal (pericardio) y pelvis (retrovesical y retrouterino).</li>
<li>El líquido pélvico es difícil de ver si la vejiga no está llena. Para que se acumule en la pelvis por gravedad hay que elevar la cabecera (<b>anti-Trendelenburg</b>); la traducción del libro dice «Trendelenburg», que haría lo contrario.</li>
<li>La ecografía detecta mejor el <b>líquido libre</b> que la lesión del órgano: un estudio mostró sensibilidad del <b>98 % para líquido</b> pero solo <b>41 % para lesiones orgánicas</b>.</li>
<li>La ecografía con contraste ayuda a ver laceraciones hepáticas y esplénicas antes de que haya hemoperitoneo. Las lesiones <b>pancreáticas</b> (cinturón de seguridad) pueden no verse al inicio ni en ecografía ni en TC.</li>
<li>Líquido libre en una mujer → explorar la pelvis: en edad fértil incluir el <b>embarazo ectópico</b>.</li>
</ul>
<h4>Otras urgencias</h4>
<ul>
<li><b>Perforación</b>: pequeñas cantidades de líquido «espeso» (partículas, gas) cerca del duodeno o en el saco menor.</li>
<li><b>Obstrucción</b>: asas dilatadas con líquido y peristaltismo «hiperactivo»; la ecografía muestra bien la obstrucción pero no tanto su causa.</li>
<li><b>Cólico renal</b>: en etapas iniciales puede haber obstrucción <b>sin dilatación</b>; una pelvis mínimamente dilatada en un paciente con dolor lumbar merece atención; el IR es más alto en el riñón obstruido.</li>
<li><b>Aneurisma de aorta</b>: la ecografía confirma o descarta el aneurisma, pero <b>no debe usarse para evaluar la fuga o rotura</b>; no se debe retrasar la cirugía urgente por estudios de imagen.</li>
<li>Absceso o hematoma del <b>psoas</b>: la ecografía es la primera investigación.</li>
</ul>`

<h4>Ventajas de guiar procedimientos con ecografía</h4>
<ul>
<li>Se ve la punta de la aguja en <b>tiempo real</b> a lo largo de su trayecto y dentro de la lesión.</li>
<li>Más precisión (esencial en lesiones pequeñas y profundas) y <b>menos pases</b> → menos complicaciones.</li>
<li>Se eligen rutas que evitan vasos; aumenta la confianza en un resultado negativo.</li>
<li>Rápida, sin radiación, de bajo costo, posible a pie de cama.</li>
</ul>
<p>Procedimientos: biopsia hepática, pancreática y renal, paracentesis, drenaje de abscesos, colecistostomía, nefrostomía, drenaje de quistes, tratamiento percutáneo de tumores hepáticos.</p>
<h4>Complicaciones de la biopsia</h4>
<ul>
<li>Con aguja de calibre 18: mortalidad ≈ <b>1 de cada 3.300–5.400</b> pacientes (70 % por hemorragia) y morbilidad ≈ <b>1 de cada 530</b> biopsias.</li>
<li>Mayor riesgo de sangrado en cirrosis y en lesiones malignas.</li>
<li>Siembra tumoral en el trayecto: rara, ≈ 1 de cada 20.000 (mesotelioma, hepatoma).</li>
</ul>
<h4>Ecografía con contraste (EC)</h4>
<ul>
<li>Microburbujas pequeñas que cruzan los capilares pulmonares y <b>permanecen en el espacio intravascular</b> (a diferencia de los contrastes de TC y RM).</li>
<li>Usos: confirmar <b>permeabilidad vascular</b> (trombosis en hepatopatía crónica, trasplantes), <b>caracterizar</b> lesiones hepáticas en fases arterial, portal y sinusoidal (hemangioma, hepatoma, HNF) y <b>detectar</b> lesiones; traumatismo de órganos sólidos.</li>
<li>Riesgo teórico de cavitación (índice mecánico).</li>
</ul>`

<tr><td>Dolor con intolerancia a las grasas</td><td>Cálculos, barro, pólipos</td><td>Origen biliar</td></tr>
<tr><td>Fiebre + ictericia + dolor</td><td>Dilatación, cálculos, paredes de conductos engrosadas</td><td>Colangitis: drenaje biliar urgente (endoscópico)</td></tr>

</tbody></table></div>

  tarjetas: [
    ['a1', 'Regla de planos y posiciones en el abdomen superior', 'Cada órgano en al menos 2 planos perpendiculares y con el paciente en al menos 2 posiciones.', 'Bates, cap. 2, p. 22'],
    ['a1', 'Dónde colocar la zona focal al buscar cálculos pequeños', 'En la pared posterior de la vesícula.', 'Bates, cap. 2, p. 35; cap. 3, fig. 3.5'],
    ['a1', 'Cómo medir la pared vesicular', 'En corte longitudinal, con calibres perpendiculares a la pared (el transversal la sobrestima).', 'Bates, cap. 2, p. 34'],
    ['a1', 'Cómo medir el colédoco', 'Diámetro interno, en su punto más ancho, en corte longitudinal; nunca en transversal.', 'Bates, cap. 2, p. 42'],
    ['a1', 'Posición para desplegar el gorro frigio', 'Decúbito con el lado derecho elevado, casi prono o de pie.', 'Bates, cap. 2, p. 36'],
    ['a1', 'Cinco maniobras para ver el páncreas', 'Compresión del epigastrio, inspiración/espiración forzada, cambiar de posición, abombar el abdomen (Valsalva), 300 ml de agua.', 'ABC, p. 25; Bates, cap. 5, p. 158'],
    ['a1', 'Cabeza del páncreas tapada por gas duodenal: ¿qué posición?', 'Lado izquierdo elevado: el gas sube hacia la cola.', 'Bates, cap. 5, p. 155'],
    ['a1', 'Abordaje para Doppler de la vena porta', 'Oblicuo derecho intercostal, con el vaso hacia el transductor (< 60°).', 'Bates, cap. 2, p. 32'],
    ['a2', 'Ecogenicidad normal del hígado', 'Homogénea, grano fino; igual o algo mayor que la corteza renal y algo menor que el bazo.', 'ABC, p. 12'],
    ['a2', 'Tamaño normal del lóbulo hepático derecho', '< 15 cm (longitudinal en línea medioclavicular).', 'ABC, p. 13'],
    ['a2', 'Proporción normal del caudado', 'No debe superar el 35 % del lóbulo izquierdo.', 'ABC, p. 13'],
    ['a2', 'Riedel vs hepatomegalia', 'Mirar el lóbulo izquierdo: si también está abultado y redondeado, es hepatomegalia.', 'Bates, cap. 2, p. 23'],
    ['a2', 'Segmento I: localización', 'Caudado, posterior, entre la VCI y el ligamento venoso.', 'ABC, p. 12'],
    ['a2', 'Segmento IV: localización', 'Entre la fosa vesicular y el ligamento falciforme (IVa superior, IVb inferior).', 'ABC, p. 12'],
    ['a2', 'Segmento VI: referencia', 'Posteroinferior derecho, en relación con el polo superior del riñón derecho.', 'ABC, p. 12'],
    ['a2', 'Porta vs venas hepáticas en modo B', 'Porta: paredes gruesas y ecogénicas (tríada portal). Hepáticas: paredes finas, casi imperceptibles.', 'ABC, p. 13'],
    ['a2', 'Diámetro y velocidad normales de la porta (Bates)', 'En general ≤ 16 mm en reposo; 12–20 cm/s; monofásica ondulada, hepatópeta.', 'Bates, cap. 2, p. 32'],
    ['a2', 'Onda normal de las venas hepáticas', 'Trifásica (breve flujo hacia el hígado en la sístole auricular).', 'Bates, cap. 2, p. 34'],
    ['a2', 'Onda normal de la arteria hepática', 'Baja resistencia con buen flujo diastólico anterógrado.', 'Bates, cap. 2, p. 34'],
    ['a2', 'Pared y medidas normales de la vesícula (ABC)', 'Pared < 3 mm; ≤ 10 cm longitudinal y ≤ 4 cm transversal.', 'ABC, p. 20'],
    ['a2', 'Colédoco normal y dilatado (ABC)', 'Normal < 6 mm; dilatado > 7 mm; hasta 10 mm normal tras colecistectomía.', 'ABC, p. 24'],
    ['a2', 'Colédoco en el anciano (Bates)', 'Hasta 8–9 mm por degeneración elástica; descartar obstrucción incipiente.', 'Bates, cap. 2, p. 42'],
    ['a2', 'Medidas AP normales del páncreas', 'Cabeza ≤ 3 cm, cuerpo ≤ 2,5 cm, cola ≤ 2 cm; conducto < 3 mm.', 'ABC, p. 25'],
    ['a2', 'Ecogenicidad del páncreas según la edad', 'Joven: voluminoso e hipoecoico. Adulto: algo más ecogénico que el hígado. Anciano: muy ecogénico y atrófico.', 'Bates, cap. 5, p. 158'],
    ['a2', 'Ausencia focal de grasa en el páncreas', 'Uncinado/cabeza ventral hipoecoicos, sin efecto de masa: variante normal.', 'Bates, cap. 5, p. 170'],
    ['a3', 'Tres signos de hepatitis viral aguda (ABC)', 'Hepatomegalia, ecogenicidad disminuida con «cielo estrellado», pared vesicular engrosada.', 'ABC, p. 14'],
    ['a3', 'Grados de esteatosis (ABC)', 'Leve: ↑ecogenicidad vs riñón. Moderada: cuesta ver vasos y diafragma. Severa: no se ven vasos, LHD posterior ni diafragma.', 'ABC, pp. 14–15'],
    ['a3', 'Grasa vs fibrosis en el hígado', 'Ambas aumentan la ecogenicidad; solo la grasa aumenta además la atenuación.', 'Bates, cap. 4, p. 125'],
    ['a3', 'Sitios típicos de esteatosis focal o zona libre de grasa', 'Segmento IV delante de la porta o de la vesícula, caudado, lóbulo izquierdo posterior.', 'Bates, cap. 4, pp. 109–111'],
    ['a3', 'Signos ecográficos de cirrosis', 'Hígado atrófico con caudado > 35 % LHI, superficie nodular, ecoestructura grosera, signos de hipertensión portal.', 'ABC, p. 15'],
    ['a3', 'Nódulo de 2 cm en un hígado cirrótico', 'Más del 90 % de probabilidad de malignidad (CHC).', 'Bates, cap. 4, p. 125'],
    ['a3', 'Hipertensión portal según el ABC', 'Porta > 13 mm con velocidad baja o invertida; bazo > 13 cm con vena esplénica > 9 mm; ascitis.', 'ABC, p. 15'],
    ['a3', 'Cinco patrones de flujo portal en la hipertensión portal', 'Lento (< 10 cm/s), amortiguado, invertido (hepatófugo), equilibrado (bidireccional) y trombosado.', 'Bates, cap. 4, p. 129'],
    ['a3', 'Colateral portosistémica en el borde inferior del bazo', 'Shunt esplenorrenal.', 'Bates, cap. 4, p. 135'],
    ['a3', 'Mejor signo de trombosis portal fresca', 'Ausencia de flujo en Doppler energía bien ajustado (el trombo fresco puede ser anecoico).', 'Bates, cap. 4, p. 129'],
    ['a3', 'Velocidad normal en un TIPS', '1–2 m/s, constante; < 50 cm/s sugiere estenosis.', 'Bates, cap. 4, p. 136'],
    ['a3', 'Budd-Chiari: tres hallazgos', 'Venas hepáticas no visibles o trombosadas, hipertrofia del caudado, colaterales (más ascitis).', 'Bates, cap. 4, p. 140'],
    ['a3', 'Quiste hepático simple: tres criterios', 'Anecoico, bordes bien definidos, refuerzo acústico posterior.', 'ABC, p. 16'],
    ['a3', 'Hemangioma hepático típico', 'Redondeado, hiperecoico, bien definido, refuerzo leve, sin flujo Doppler. Mujeres 5:1.', 'ABC, p. 16'],
    ['a3', 'Hiperplasia nodular focal', 'Iso/levemente hipoecoica, < 5 cm, cicatriz central hiperecoica, rueda de radios. Mujeres 8:1.', 'ABC, p. 16'],
    ['a3', 'Absceso piógeno vs amebiano (ABC)', 'Amebiano: único, pared fina, contenido homogéneo. Piógeno: múltiple, pared gruesa, heterogéneo.', 'ABC, p. 17'],
    ['a3', 'Porcentaje de abscesos hepáticos con gas', '≈ 20 %: focos hiperecoicos con reverberación.', 'ABC, p. 17'],
    ['a3', 'Quiste hidatídico: hallazgos', 'Cápsula de dos capas desprendida, quistes hijos (panal/rueda de carro), membranas, arena; calcificado = inactivo.', 'Bates, cap. 4, p. 103'],
    ['a3', 'Metástasis hiperecoicas: origen típico', 'Digestivo, sobre todo colon.', 'ABC, p. 19'],
    ['a3', 'Metástasis hipoecoicas: origen típico', 'Mama o pulmón no tratados (también estómago, páncreas, esófago).', 'ABC, p. 19'],
    ['a3', 'Metástasis calcificadas: origen típico', 'Adenocarcinoma mucinoso de colon y adenocarcinoma de mama.', 'ABC, p. 19'],
    ['a3', 'CHC en ecografía', 'Pequeño: hipoecoico con halo. Grande: heterogéneo con necrosis que infiltra vasos; neovascularización de alta velocidad.', 'ABC, p. 18'],
    ['a3', 'Patrón del CHC con contraste', 'Realce arterial y lavado en fase sinusoidal.', 'Bates, cap. 4, p. 121'],
    ['a3', 'Tres propiedades del cálculo vesicular', 'Muy reflectante, móvil y con sombra acústica posterior.', 'Bates, cap. 3, p. 52'],
    ['a3', 'Cálculo sin sombra: tres ajustes', 'Foco en la pared posterior, mayor frecuencia, bajar la ganancia (evitar saturación).', 'Bates, cap. 3, p. 53'],
    ['a3', 'Barro biliar', 'Ecos internos declives con nivel líquido-líquido que se movilizan lentamente.', 'ABC, p. 20'],
    ['a3', 'Pólipo: criterios de malignidad', 'Único, > 10 mm, crecimiento rápido, sésil.', 'ABC, p. 21'],
    ['a3', 'Manejo de pólipos vesiculares (ABC)', '< 10 mm: control semestral/anual. ≥ 10 mm: cirugía. Con síntomas o cálculos: colecistectomía.', 'ABC, p. 22'],
    ['a3', 'Hallazgos de colecistitis aguda (ABC)', 'Pared > 3 mm, distensión > 4 cm, cálculo impactado, líquido pericolecístico, Murphy ecográfico.', 'ABC, p. 22'],
    ['a3', 'Colecistitis gangrenosa', 'Pared asimétrica con abscesos intramurales y membranas intraluminales; cirugía inmediata.', 'Bates, cap. 3, p. 73'],
    ['a3', 'Colecistitis enfisematosa', 'Gas en luz y pared (diabéticos), sombra «ruidosa» que imita intestino.', 'Bates, cap. 3, p. 74'],
    ['a3', 'Vesícula de porcelana', 'Pared calcificada en cáscara de huevo con sombra; riesgo de carcinoma → colecistectomía profiláctica.', 'ABC, p. 23'],
    ['a3', 'Causas extrínsecas de pared vesicular engrosada', 'Hepatitis, pancreatitis, LES, cirrosis, ascitis, hipoalbuminemia, insuficiencia cardíaca.', 'ABC, p. 23'],
    ['a3', 'Signo del doble cañón de escopeta', 'Conducto biliar dilatado paralelo a la porta, de diámetro similar; uno con Doppler y otro no.', 'ABC, p. 24'],
    ['a3', 'Nivel de obstrucción con doble conducto', 'Cabeza de páncreas o ampolla (más probable carcinoma o pancreatitis que cálculo).', 'Bates, cap. 3, p. 77'],
    ['a3', 'Fiabilidad de la ecografía para cálculos del colédoco distal', 'Baja (gas duodenal): colangio-RM o ecoendoscopia.', 'Bates, cap. 3, p. 79'],
    ['a3', 'Síndrome de Mirizzi en ecografía', 'Vesícula contraída, cálculo en el cuello, dilatación intrahepática con colédoco inferior normal.', 'Bates, cap. 3, p. 64'],
    ['a3', 'Neumobilia', 'Ecos lineales muy reflectantes que siguen los conductos, con sombra reverberante; tras CPRE o esfinterotomía.', 'Bates, cap. 3, p. 91'],
    ['a3', 'Parásitos biliares en Sudamérica', 'Ascaris y trematodos: estructuras lineales hiperecoicas en vesícula o conductos dilatados.', 'Bates, cap. 3, p. 87'],
    ['a3', 'Criterios diagnósticos de pancreatitis aguda', '2 de 3: dolor típico, amilasa/lipasa > 3 veces, imagen característica.', 'ABC, p. 26'],
    ['a3', 'Papel principal de la ecografía en la pancreatitis aguda', 'Buscar la causa (cálculos, barro, microlitiasis) y complicaciones; el páncreas puede verse normal.', 'Bates, cap. 5, p. 160'],
    ['a3', 'Seudoquiste pancreático', 'Colección sin epitelio (10–20 % de PA): anecoica, paredes lisas, refuerzo; 1 a > 8 cm.', 'ABC, p. 26'],
    ['a3', 'Pancreatitis crónica: hallazgos', 'Calcificaciones, parénquima heterogéneo, Wirsung dilatado irregular, seudoquistes, atrofia.', 'ABC, p. 27'],
    ['a3', 'Distribución del adenocarcinoma de páncreas (ABC)', 'Cabeza 70 %, cuerpo 20 %, cola 10 %; masa hipoecoica mal definida > 2 cm.', 'ABC, p. 28'],
    ['a3', 'Frecuencia de hallazgos secundarios en el cáncer de páncreas (Bates)', 'Dilatación biliar 69 %, Wirsung 37 %, doble conducto 34 %.', 'Bates, cap. 5, p. 169'],
    ['a4', 'Ictericia obstructiva vs no obstructiva en ecografía', 'Obstructiva: hay dilatación de la vía biliar. No obstructiva: no la hay.', 'Bates, cap. 2, p. 44'],
    ['a4', 'Enzima que se eleva antes en la obstrucción biliar incipiente', 'Fosfatasa alcalina.', 'Bates, cap. 3, p. 82'],
    ['a4', 'Ley de Courvoisier', 'Vesícula dilatada con ictericia: no es cálculo del colédoco (tiene muchas excepciones).', 'Bates, cap. 3, p. 79'],
    ['a4', 'Cuadro 2.2: tres cosas que hacer siempre', 'Historia oral del paciente, estudios previos, pensar en varias patologías.', 'Bates, cap. 2, p. 45'],
    ['a4', 'Borde hepático palpable sin patología hepática', 'Explorar el tórax: un derrame pleural puede desplazar el hígado.', 'Bates, cap. 2, p. 46']
  ],

    { c: 'a1', q: 'Un cálculo vesicular pequeño no muestra sombra. ¿Qué ajuste es más útil?', o: ['Subir la ganancia', 'Colocar la zona focal en la pared posterior de la vesícula', 'Bajar la frecuencia', 'Ampliar el sector'], a: 1, e: 'El cálculo debe estar en la zona más estrecha del haz para generar sombra; también ayuda bajar la ganancia y subir la frecuencia.', f: 'Bates, cap. 3, pp. 53–55' },
    { c: 'a1', q: 'El colédoco debe medirse:', o: ['En transversal a nivel de la cabeza del páncreas', 'En longitudinal, diámetro interno en su punto más ancho', 'En la porción intrahepática únicamente', 'Con Doppler color siempre'], a: 1, e: 'El corte transversal es oblicuo y sobrestima el diámetro.', f: 'Bates, cap. 2, p. 42' },

    { c: 'a1', q: 'Un estudio con vesícula de pared aparentemente engrosada en corte transversal debe:', o: ['Informarse como colecistitis', 'Medirse en longitudinal perpendicular a la pared', 'Repetirse con Doppler', 'Ignorarse'], a: 1, e: 'Un corte no perpendicular sobrestima el grosor parietal (fig. 2.29).', f: 'Bates, cap. 2, p. 34' },
    { c: 'a2', q: 'Diámetro longitudinal máximo normal del lóbulo hepático derecho según el ABC:', o: ['10 cm', '15 cm', '20 cm', '25 cm'], a: 1, e: 'Medido en línea medioclavicular; > 15 cm sugiere hepatomegalia.', f: 'ABC, p. 13' },
    { c: 'a2', q: 'El segmento hepático que se relaciona con el polo superior del riñón derecho es el:', o: ['II', 'IV', 'VI', 'VIII'], a: 2, e: 'El segmento VI es posteroinferior derecho.', f: 'ABC, p. 12' },
    { c: 'a2', q: 'Prolongación en lengua del lóbulo derecho por debajo del riñón con lóbulo izquierdo pequeño:', o: ['Hepatomegalia', 'Lóbulo de Riedel', 'Cirrosis', 'Metástasis'], a: 1, e: 'Variante normal; en la hepatomegalia el lóbulo izquierdo también está abultado.', f: 'Bates, cap. 2, p. 23' },
    { c: 'a2', q: 'Patrón Doppler normal de la vena porta:', o: ['Trifásico', 'Monofásico hepatópeto con ondulaciones', 'Alta resistencia', 'Bidireccional'], a: 1, e: 'Velocidad 12–20 cm/s; la ondulación refleja un hígado flexible normal.', f: 'Bates, cap. 2, p. 32' },
    { c: 'a2', q: 'Colédoco normal en paciente colecistectomizado, según el ABC:', o: ['Hasta 4 mm', 'Hasta 6 mm', 'Hasta 10 mm', 'Hasta 15 mm'], a: 2, e: 'Tras colecistectomía se acepta hasta 10 mm; en el resto, > 7 mm es dilatado.', f: 'ABC, p. 24' },
    { c: 'a2', q: 'Páncreas hiperecoico y atrófico en un paciente de 80 años asintomático. Interpretación:', o: ['Pancreatitis crónica', 'Cambio normal con la edad', 'Adenocarcinoma', 'Pancreatitis aguda'], a: 1, e: 'El páncreas se infiltra de grasa con la edad; el mismo aspecto en un joven sería anormal.', f: 'Bates, cap. 5, p. 158' },
    { c: 'a2', q: 'Diámetro AP máximo normal de la cabeza del páncreas:', o: ['1,5 cm', '2 cm', '3 cm', '4,5 cm'], a: 2, e: 'Cabeza ≤ 3 cm, cuerpo ≤ 2,5 cm, cola ≤ 2 cm.', f: 'ABC, p. 25' },
    { c: 'a3', q: 'Hígado brillante con atenuación que impide ver el diafragma y la parte posterior del lóbulo derecho:', o: ['Esteatosis leve', 'Esteatosis moderada', 'Esteatosis severa', 'Fibrosis sin grasa'], a: 2, e: 'La fibrosis aumenta la ecogenicidad sin aumentar la atenuación.', f: 'ABC, p. 15; Bates, cap. 4, p. 125' },
    { c: 'a3', q: 'Zona hipoecoica de bordes rectos delante de la vesícula en un hígado graso, sin efecto de masa:', o: ['Metástasis', 'Zona libre de grasa', 'Absceso', 'CHC'], a: 1, e: 'Los vasos no se desplazan; el contraste muestra captación idéntica al hígado.', f: 'Bates, cap. 4, p. 111' },
    { c: 'a3', q: 'Hígado pequeño de contorno nodular, caudado mayor del 35 % del lóbulo izquierdo, ascitis y esplenomegalia:', o: ['Hepatitis aguda', 'Cirrosis', 'Esteatosis', 'Budd-Chiari agudo'], a: 1, e: 'Redistribución de volumen + superficie nodular + hipertensión portal.', f: 'ABC, p. 15' },
    { c: 'a3', q: 'Flujo portal bidireccional de baja velocidad en un cirrótico. Significado:', o: ['Normal', 'Flujo «equilibrado» que puede preceder a trombosis o inversión', 'Insuficiencia tricuspídea', 'Aliasing'], a: 1, e: 'La insuficiencia tricuspídea da un flujo bidireccional pulsátil de alta velocidad.', f: 'Bates, cap. 4, pp. 129, 141' },
    { c: 'a3', q: 'Vaso tortuoso en el borde inferior del bazo en un paciente con hipertensión portal:', o: ['Arteria esplénica normal', 'Shunt esplenorrenal', 'Vena paraumbilical', 'Vena coronaria'], a: 1, e: 'Estos pacientes tienen menos varices gástricas.', f: 'Bates, cap. 4, p. 135' },
    { c: 'a3', q: 'Lesión hepática redondeada, hiperecoica, bien definida, con refuerzo leve y sin flujo, en una mujer asintomática:', o: ['Metástasis', 'Hemangioma', 'HNF', 'Absceso'], a: 1, e: 'Patrón típico del tumor benigno hepático más frecuente.', f: 'ABC, p. 16' },
    { c: 'a3', q: 'Lesión isoecoica con cicatriz central hiperecoica y Doppler en rueda de radios:', o: ['Hemangioma', 'Hiperplasia nodular focal', 'Adenoma', 'CHC'], a: 1, e: 'Segundo tumor benigno; mujeres 8:1; no requiere tratamiento.', f: 'ABC, p. 16' },
    { c: 'a3', q: 'En un paciente con quiste hepático con membranas desprendidas y quistes hijos, lo que NO debe hacerse es:', o: ['Pedir serología', 'Puncionar sin conocer el diagnóstico', 'Valorar tratamiento percutáneo con escleroterapia', 'Hacer TC'], a: 1, e: 'Una aspiración sin saber que es hidatídico puede sembrar el parásito en el trayecto.', f: 'Bates, cap. 4, p. 103' },
    { c: 'a3', q: 'Múltiples metástasis hepáticas calcificadas con sombra. Origen más probable:', o: ['Pulmón', 'Adenocarcinoma mucinoso de colon o mama', 'Linfoma', 'Melanoma'], a: 1, e: 'Patrón calcificado clásico.', f: 'ABC, p. 19' },
    { c: 'a3', q: 'En un cirrótico, un nódulo nuevo de 2,5 cm tiene una probabilidad de malignidad de:', o: ['< 10 %', '≈ 50 %', '> 90 %', '0 %'], a: 2, e: 'Nódulo ≥ 2 cm en cirrosis: casi seguro CHC; estadificar.', f: 'Bates, cap. 4, p. 125' },
    { c: 'a3', q: 'Ecos internos declives en la vesícula, con nivel y movimiento lento al cambiar de posición, sin sombra:', o: ['Pólipos', 'Barro biliar', 'Cálculos', 'Adenomiomatosis'], a: 1, e: 'Sedimento biliar por bilis estancada.', f: 'ABC, p. 20' },
    { c: 'a3', q: 'Pólipo vesicular único, sésil, de 12 mm en un paciente de 60 años. Conducta según el ABC:', o: ['Control en 5 años', 'Interconsulta con cirugía para colecistectomía', 'Nada', 'Antibióticos'], a: 1, e: '≥ 10 mm → colecistectomía.', f: 'ABC, p. 22' },
    { c: 'a3', q: 'Pared vesicular engrosada en un paciente con hepatitis aguda y sin dolor a la presión:', o: ['Colecistitis aguda', 'Engrosamiento por causa extrínseca', 'Carcinoma', 'Adenomiomatosis'], a: 1, e: 'El engrosamiento de pared no es sinónimo de colecistitis.', f: 'ABC, p. 23; Bates, fig. 3.23' },
    { c: 'a3', q: 'Diabético con sepsis; en la vesícula, gas que asciende a la pared anterior con sombra «ruidosa» que oculta el contenido:', o: ['Neumobilia', 'Colecistitis enfisematosa', 'Vesícula de porcelana', 'Intestino normal'], a: 1, e: 'Gas en luz y pared por gérmenes formadores de gas.', f: 'Bates, cap. 3, p. 74' },

<li><b>Perforación</b>: pérdida de la ecogenicidad de la submucosa, pared asimétrica, colección o absceso periapendicular.</li>
<li>Un apéndice no visualizado no excluye apendicitis: correlacionar con la clínica (escala de Alvarado), repetir o TC/RM según el caso.</li>
</ul>
<h4>Invaginación intestinal (intususcepción)</h4>
<ul>
<li>Niños de 3 meses a 3 años, más frecuente <b>ileocólica</b> (hipocondrio o flanco derecho).</li>
<li>Transversal: «<b>diana</b>» o «<b>donut</b>» (anillos concéntricos); longitudinal: «<b>pseudorriñón</b>» o «sándwich».</li>
<li>Tratamiento en niños: reducción hidrostática o neumática guiada si no hay perforación ni peritonitis. En adultos suele haber una <b>causa orgánica</b> (tumor) → cirugía.</li>
</ul>
<h4>Estenosis hipertrófica del píloro</h4>
<ul>
<li>Lactante de 2–8 semanas con <b>vómitos en proyectil no biliosos</b>, «oliva» palpable, alcalosis metabólica hipoclorémica e hipopotasémica.</li>
<li>Criterios: <b>grosor muscular ≥ 3 mm</b>, <b>longitud del canal ≥ 15–17 mm</b>, sin paso de contenido gástrico. Signos de la diana y del «cérvix».</li>
</ul>
<h4>Obstrucción intestinal</h4>
<ul>
<li>Asas de intestino delgado dilatadas <b>&gt; 2,5–3 cm</b> con contenido líquido; peristaltismo de vaivén (<i>to-and-fro</i>).</li>
<li>Signos de sufrimiento: asa aperistáltica, pared engrosada, líquido libre entre asas, ausencia de flujo en Doppler → isquemia/estrangulación: cirugía.</li>
</ul>
<h4>Engrosamiento de la pared</h4>
<ul>
<li><b>Enfermedad de Crohn</b>: íleon terminal engrosado, hiperemia, <b>grasa mesentérica hiperecoica</b> («grasa reptante»), estenosis, fístulas, abscesos.</li>
<li><b>Carcinoma</b>: engrosamiento asimétrico, hipoecoico, con pérdida de las capas: imagen en «pseudorriñón».</li>
<li><b>Linfoma</b>: engrosamiento muy hipoecoico, a veces con dilatación aneurismática de la luz.</li>
<li><b>Diverticulitis</b>: divertículo inflamado (protrusión con foco ecogénico/gas) con grasa pericólica hiperecoica y pared colónica engrosada; colecciones.</li>
</ul>
<h4>Hernias de pared</h4>
<p>Defecto de pared con contenido (grasa, asa); maniobra de Valsalva. Encarcelación/estrangulación: asa sin peristaltismo, pared engrosada, sin flujo, líquido en el saco.</p>`

  function cargar() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); var b = base(); for (var k in b) if (o[k]) b[k] = o[k]; return b; } } catch (e) {}
    return base();
  }
  var S = cargar();

  /* ---------- Normalizar contenido ---------- */
  var porId = {};

    c.preguntas = (c.preguntas || []).map(function (p) { var o = { id: c.id + '-p' + hash(p.q), curso: c }; for (var k in p) o[k] = p[k]; return o; });
    c.glosario = c.glosario || [];
    c.fuentes = c.fuentes || [];
  });

  /* ---------- Repetición espaciada (SM-2 simplificado) ---------- */
  function calcular(t, g) {
    var s = S.cards[t.id] || { i: 0, e: 2.5, r: 0, l: 0, d: 0 };
    var i = s.i, e = s.e, l = s.l;
    if (g === 0) { i = 0; e = Math.max(1.3, e - 0.2); l++; }
    else if (g === 1) { i = i < 1 ? 1 : Math.max(i + 1, Math.round(i * 1.2)); e = Math.max(1.3, e - 0.15); }
    else if (g === 2) { i = i < 1 ? 1 : i < 3 ? 3 : Math.round(i * e); }
    else { i = i < 1 ? 3 : Math.round(i * e * 1.3); e = e + 0.15; }
    return { i: i, e: e, r: s.r + 1, l: l, d: hoy() + i };
  }
  function etiquetaIntervalo(i) { if (i === 0) return 'otra vez'; if (i < 30) return i + ' d'; if (i < 365) return Math.round(i / 30) + ' m'; return (i / 365).toFixed(1) + ' a'; }
  function dominioTarjeta(t) { var s = S.cards[t.id]; if (!s) return 0; return s.i >= 10 ? 1 : s.i >= 3 ? 0.75 : s.i >= 1 ? 0.4 : 0.1; }
  function vencida(t) { var s = S.cards[t.id]; return s && s.d <= hoy(); }
  function nueva(t) { return !S.cards[t.id]; }
  function todasTarjetas() { var a = []; CURSOS.forEach(function (c) { a = a.concat(c.tarjetas); }); return a; }
  function pendientesHoy(lista) { var v = lista.filter(vencida).length; var n = Math.min(lista.filter(nueva).length, NUEVAS_POR_SESION); return v + n; }

  /* ---------- Dominio ponderado ---------- */
  function puntajeCriterio(c, cr) {
    var ts = c.tarjetas.filter(function (t) { return t.c === cr.id; });
    var ps = c.preguntas.filter(function (p) { return p.c === cr.id; });
    var a = ts.length ? ts.reduce(function (s, t) { return s + dominioTarjeta(t); }, 0) / ts.length : null;
    var b = ps.length ? ps.filter(function (p) { return S.quiz[p.id] && S.quiz[p.id].ok; }).length / ps.length : null;
    if (a === null && b === null) return 0; if (a === null) return b; if (b === null) return a;
    return (a + b) / 2;
  }
  function puntajeCurso(c) {
    var tot = c.criterios.reduce(function (s, cr) { return s + cr.peso; }, 0) || 1;
    return c.criterios.reduce(function (s, cr) { return s + cr.peso * puntajeCriterio(c, cr); }, 0) / tot;
  }

  /* ---------- Sesiones en memoria ---------- */
  var ses = null;

  /* ---------- Router ---------- */
  function ruta() {

    return { vista: h };

    else if (r.vista === 'biblioteca') vistaBiblioteca();
    else vistaInicio();
    window.scrollTo(0, 0);
  }
  function actualizarBadge() {

  }

    app.innerHTML =
      '<section class="hero">' +
        '<div class="stack">' +

        '</a>';

  /* Imagen decorativa en modo B: abanico convexo con speckle */
  function pintarBmode(cv) {
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    ctx.fillStyle = '#05080a'; ctx.fillRect(0, 0, W, H);
    var cx = W / 2, cy = -60, r0 = 110, r1 = H + 40, a0 = Math.PI / 2 - 0.62, a1 = Math.PI / 2 + 0.62;
    var img = ctx.getImageData(0, 0, W, H), d = img.data;
    // estructuras: vesícula anecoica, pared hiperecoica, cálculo con sombra
    var ves = { x: W * 0.47, y: H * 0.5, rx: 92, ry: 50 };
    var lit = { x: W * 0.52, y: H * 0.58, r: 15 };
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var dx = x - cx, dy = y - cy, r = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx);
        if (r < r0 || r > r1 || a < a0 || a > a1) continue;
        var prof = (r - r0) / (r1 - r0);
        var v = 70 + 90 * rnd() * rnd() * 2.2;
        v *= 1 - prof * 0.45; // atenuación
        var ex = (x - ves.x) / ves.rx, ey = (y - ves.y) / ves.ry, e = ex * ex + ey * ey;
        if (e < 1) v = 6 + 10 * rnd();
        else if (e < 1.18) v = 150 + 80 * rnd();
        var lx = x - lit.x, ly = y - lit.y;
        if (lx * lx + ly * ly < lit.r * lit.r) v = 225 + 30 * rnd();
        else if (y > lit.y && Math.abs(lx) < lit.r * 0.95 && e >= 0) { if (y > lit.y + lit.r * 0.5) v *= 0.12; }
        // refuerzo posterior bajo la vesícula
        if (e >= 1.18 && Math.abs(x - ves.x) < ves.rx * 0.8 && y > ves.y + ves.ry && !(Math.abs(lx) < lit.r)) v *= 1.35;
        var k = (y * W + x) * 4; v = Math.max(0, Math.min(255, v));
        d[k] = v; d[k + 1] = v; d[k + 2] = v; d[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    // escala de profundidad
    ctx.fillStyle = '#9fb0b8';
    for (var i = 0; i <= 14; i++) { var yy = 30 + i * ((H - 50) / 14); ctx.fillRect(W - 16, yy, i % 5 === 0 ? 10 : 5, 1.5); }
    // calibradores
    ctx.strokeStyle = '#f0b84a'; ctx.lineWidth = 2;
    function cruz(x, y) { ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke(); }
    cruz(ves.x - ves.rx + 4, ves.y); cruz(ves.x + ves.rx - 4, ves.y);
    ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(ves.x - ves.rx + 10, ves.y); ctx.lineTo(ves.x + ves.rx - 10, ves.y); ctx.stroke(); ctx.setLineDash([]);
  }

        (cr.temas || []).map(function (t) {
          return '<details class="tema" data-tema="' + t.id + '"><summary>' + esc(t.titulo) + (S.leidos[t.id] ? '<span class="chk">✓ estudiado</span>' : '') + '</summary>' +

  /* ---------- Tarjetas ---------- */
  function selectCriterio(c, val, id) {
    return '<select id="' + id + '" aria-label="Criterio"><option value="todos">Todos los criterios</option>' + c.criterios.map(function (cr) {
      return '<option value="' + cr.id + '"' + (cr.id === val ? ' selected' : '') + '>' + cr.peso + '% · ' + esc(cr.titulo) + '</option>';
    }).join('') + '</select>';
  }
  var critPreferido = null;
  function iniciarTarjetas(c, crit, modo) {
    if (critPreferido) { crit = critPreferido; critPreferido = null; }
    var lista = c.tarjetas.filter(function (t) { return crit === 'todos' || t.c === crit; });
    var cola;
    if (modo === 'todas') cola = shuffle(lista);
    else cola = shuffle(lista.filter(vencida)).concat(lista.filter(nueva).slice(0, NUEVAS_POR_SESION));
    ses = { tipo: 'tarjetas', curso: c, crit: crit, modo: modo, cola: cola, total: cola.length, hechas: 0, vuelta: false };
    pintarTarjeta();
  }
  function pintarTarjeta() {
    var cont = document.getElementById('cuerpo'); if (!cont || !ses) return;
    var global = ses.tipo === 'repaso';
    var filtros = global ? '' :
      '<div class="filtros">' + selectCriterio(ses.curso, ses.crit, 'f-crit-t') +
      '<select id="f-modo" aria-label="Modo"><option value="pendientes"' + (ses.modo === 'pendientes' ? ' selected' : '') + '>Pendientes y nuevas</option><option value="todas"' + (ses.modo === 'todas' ? ' selected' : '') + '>Todas (repaso libre)</option></select></div>';

      cont.innerHTML = filtros + '<div class="fc"><h3>Sin tarjetas pendientes</h3><p class="muted">' +
        (ses.hechas ? 'Repasaste ' + ses.hechas + ' tarjetas en esta sesión. ' : '') +
        'Vuelve mañana para las siguientes repeticiones' + (global ? '.' : ', o usa el modo «Todas» para repasar libremente.') + '</p>' +

      return '<button class="btn g' + g + '" data-act="calif" data-g="' + g + '">' + nombres[g] + '<small>' + etiquetaIntervalo(calcular(t, g).i) + '</small></button>';

    cont.innerHTML = filtros +

        '<div class="meta"><span class="eyebrow">' + (global ? esc(t.curso.corto) + ' · ' : '') + esc(cr ? cr.titulo : '') + '</span><span class="progreso">' + (ses.hechas + 1) + ' / ' + Math.max(ses.total, ses.hechas + ses.cola.length) + (est ? '' : ' · nueva') + '</span></div>' +
        '<div class="q">' + t.f + '</div>' +

  }
  function calificar(g) {

  /* ---------- Repaso global ---------- */

      '<p class="muted">Tarjetas vencidas de los cuatro cursos y hasta ' + NUEVAS_POR_SESION + ' nuevas. Califica con honestidad: «Otra vez» la devuelve a la sesión; «Fácil» la aleja más en el tiempo.</p></section>' +
      '<section id="cuerpo" class="stack"></section>';

  /* ---------- Preguntas (práctica) ---------- */
  function mezclarOpciones(p) {
    var idx = shuffle(p.o.map(function (_, i) { return i; }));
    return { p: p, orden: idx, resp: null };
  }
  function iniciarPreguntas(c, crit, soloFalladas) {
    if (critPreferido) { crit = critPreferido; critPreferido = null; }
    var lista = c.preguntas.filter(function (p) { return (crit === 'todos' || p.c === crit) && (!soloFalladas || !(S.quiz[p.id] && S.quiz[p.id].ok)); });
    ses = { tipo: 'preguntas', curso: c, crit: crit, falladas: soloFalladas, items: shuffle(lista).map(mezclarOpciones), pos: 0, aciertos: 0 };
    pintarPregunta();
  }
  function htmlPregunta(it, mostrarFeedback) {
    var p = it.p, cr = p.curso.critMap[p.c];
    return '<div class="qbox">' +
      '<div class="row" style="justify-content:space-between"><span class="eyebrow">' + esc(cr ? cr.peso + '% · ' + cr.titulo : '') + '</span>' + (p.caso ? '<span class="caso-tag">Caso clínico</span>' : '') + '</div>' +
      '<div class="enun">' + p.q + '</div>' +
      '<div class="opts">' + it.orden.map(function (oi, k) {

      }).join('') + '</div>' +
      (it.resp !== null && mostrarFeedback ? '<div class="expl' + (it.resp === p.a ? '' : ' mal') + '"><b>' + (it.resp === p.a ? 'Correcto. ' : 'Incorrecto. ') + '</b>' + p.e + (p.f ? ' <span class="fuente">(' + esc(p.f) + ')</span>' : '') + '</div>' : '') +

  function pintarPregunta() {

    if (!it) {
      cont.innerHTML = filtros + '<div class="qbox res"><span class="eyebrow">Resultado de la práctica</span><div class="nota mono">' + ses.aciertos + '<small> / ' + ses.items.length + '</small></div>' +
        '<p class="muted">Las preguntas falladas siguen contando como no dominadas hasta que las aciertes.</p>' +

      (it.resp !== null ? '<button class="btn pri" data-act="sig-p" style="width:100%">Siguiente</button>' : '');
  }
  function registrar(p, ok) {
    var q = S.quiz[p.id] || { n: 0, c: 0, ok: false };
    q.n++; if (ok) q.c++; q.ok = ok; S.quiz[p.id] = q; guardar();
  }

  /* ---------- Simulacro ponderado ---------- */
  function repartir(c, n) {
    var tot = c.criterios.reduce(function (s, cr) { return s + cr.peso; }, 0);
    var base = c.criterios.map(function (cr) {
      var disp = c.preguntas.filter(function (p) { return p.c === cr.id; }).length;
      var exacto = n * cr.peso / tot;
      return { cr: cr, k: Math.min(disp, Math.floor(exacto)), resto: exacto - Math.floor(exacto), disp: disp };
    });
    var faltan = n - base.reduce(function (s, b) { return s + b.k; }, 0);
    base.slice().sort(function (a, b) { return b.resto - a.resto; }).forEach(function (b) { if (faltan > 0 && b.k < b.disp) { b.k++; faltan--; } });
    while (faltan > 0) { var hubo = false; base.forEach(function (b) { if (faltan > 0 && b.k < b.disp) { b.k++; faltan--; hubo = true; } }); if (!hubo) break; }
    return base;
  }
  function pantallaSimulacro(c) {
    var cont = document.getElementById('cuerpo');
    var hist = S.sims.filter(function (s) { return s.curso === c.id; }).slice(-5).reverse();
    var max = c.preguntas.length;
    var opciones = [10, 20, 30].filter(function (n) { return n <= max; }); if (opciones.indexOf(max) < 0 && max < 30) opciones.push(max);
    cont.innerHTML = '<div class="panel"><h3>Simulacro de examen</h3>' +
      '<p class="muted">Preguntas repartidas según el peso de cada criterio. No verás si acertaste hasta el final; al terminar tendrás la nota sobre 100 ponderada por criterio y la revisión con explicaciones.</p>' +
      '<div class="tabla"><table style="min-width:0;width:100%"><thead><tr><th>Peso</th><th>Criterio</th><th>Banco</th></tr></thead><tbody>' + c.criterios.map(function (cr) {
        return '<tr><td class="mono">' + cr.peso + '%</td><td>' + esc(cr.titulo) + '</td><td class="mono">' + c.preguntas.filter(function (p) { return p.c === cr.id; }).length + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row">' + opciones.map(function (n) { return '<button class="btn' + (n === opciones[0] ? ' pri' : '') + '" data-act="sim-ini" data-n="' + n + '">' + n + ' preguntas</button>'; }).join('') + '</div></div>' +
      (hist.length ? '<div class="panel"><h3>Intentos anteriores</h3>' + hist.map(function (h) {
        return '<div class="row" style="justify-content:space-between"><span class="mono muted">' + new Date(h.t).toLocaleDateString('es') + ' · ' + h.n + ' preg.</span><b class="mono">' + h.nota + ' / 100</b></div>';
      }).join('') + '</div>' : '');
  }
  function iniciarSimulacro(c, n) {
    var rep = repartir(c, n), items = [];
    rep.forEach(function (b) { items = items.concat(shuffle(c.preguntas.filter(function (p) { return p.c === b.cr.id; })).slice(0, b.k)); });
    ses = { tipo: 'sim', curso: c, items: shuffle(items).map(mezclarOpciones), pos: 0, t0: Date.now() };
    pintarSim();
  }
  function pintarSim() {
    var cont = document.getElementById('cuerpo'); var it = ses.items[ses.pos];
    if (!it) return resultadoSim();
    cont.innerHTML = '<p class="progreso">Simulacro · ' + (ses.pos + 1) + ' de ' + ses.items.length + '</p>' + htmlPregunta(it, false) +
      '<div class="row"><button class="btn" data-act="sim-ant"' + (ses.pos === 0 ? ' disabled' : '') + '>Anterior</button>' +
      '<button class="btn pri" data-act="sim-sig" style="flex:1">' + (ses.pos === ses.items.length - 1 ? 'Terminar y ver nota' : 'Siguiente') + '</button></div>';
  }
  function resultadoSim() {
    var c = ses.curso, cont = document.getElementById('cuerpo');
    var porCrit = {};
    ses.items.forEach(function (it) {
      var k = it.p.c; porCrit[k] = porCrit[k] || { n: 0, ok: 0 }; porCrit[k].n++;
      var ok = it.resp === it.p.a; if (ok) porCrit[k].ok++;
      registrar(it.p, ok);
    });
    var pesoTot = 0, acum = 0;
    c.criterios.forEach(function (cr) { var r = porCrit[cr.id]; if (r) { pesoTot += cr.peso; acum += cr.peso * r.ok / r.n; } });
    var nota = Math.round(pesoTot ? acum / pesoTot * 100 : 0);
    var min = Math.round((Date.now() - ses.t0) / 60000);
    S.sims.push({ curso: c.id, t: Date.now(), n: ses.items.length, nota: nota }); guardar();
    cont.innerHTML = '<div class="qbox res"><span class="eyebrow">Nota ponderada · ' + min + ' min</span><div class="nota mono">' + nota + '<small> / 100</small></div>' +
      '<div class="tgc">' + c.criterios.map(function (cr) {
        var r = porCrit[cr.id]; if (!r) return '';
        var p = r.ok / r.n;
        return '<div class="l"><span class="w">' + cr.peso + '%</span><span class="bar' + (p >= 0.8 ? ' ok' : '') + '"><i style="width:' + pct(p) + '%"></i></span><span class="v">' + r.ok + '/' + r.n + '</span></div><p class="muted" style="font-size:.85rem;margin:-2px 0 4px 3.2rem">' + esc(cr.titulo) + '</p>';
      }).join('') + '</div>' +
      '<div class="row"><button class="btn pri" data-act="sim-otra">Nuevo simulacro</button></div></div>' +
      '<h3>Revisión</h3><div class="revision">' + ses.items.map(function (it, i) {
        var ok = it.resp === it.p.a;
        return '<div class="it ' + (ok ? 'bien' : 'mal') + '"><b>' + (i + 1) + '. ' + strip(it.p.q) + '</b>' +
          '<span>' + (ok ? '✓ ' : '✗ Tu respuesta: ' + (it.resp === null ? 'sin responder' : strip(it.p.o[it.resp])) + ' · Correcta: ') + (ok ? strip(it.p.o[it.p.a]) : strip(it.p.o[it.p.a])) + '</span>' +
          '<span class="muted">' + it.p.e + (it.p.f ? ' <i>(' + esc(it.p.f) + ')</i>' : '') + '</span></div>';
      }).join('') + '</div>';
    window.scrollTo(0, 0);
  }

  /* ---------- Glosario ---------- */
  function vistaGlosario() {
    var items = [];
    CURSOS.forEach(function (c) { c.glosario.forEach(function (g) { items.push({ t: g[0], d: g[1], c: c }); }); });
    items.sort(function (a, b) { return a.t.localeCompare(b.t, 'es'); });
    app.innerHTML = '<section class="chead"><span class="eyebrow">' + items.length + ' términos</span><h1>Glosario</h1></section>' +
      '<div class="filtros"><input type="search" id="buscar" placeholder="Buscar término o definición…" style="flex:1;min-width:0">' +
      '<select id="glos-curso" aria-label="Curso"><option value="">Todos los cursos</option>' + CURSOS.map(function (c) { return '<option value="' + c.id + '">' + esc(c.corto) + '</option>'; }).join('') + '</select></div>' +
      '<dl class="glos" id="glos"></dl>';
    function filtrar() {
      var q = (document.getElementById('buscar').value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      var cid = document.getElementById('glos-curso').value;
      var html = items.filter(function (it) {
        var txt = (it.t + ' ' + it.d).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        return (!cid || it.c.id === cid) && (!q || txt.indexOf(q) >= 0);
      }).map(function (it) { return '<div class="g"><dt>' + esc(it.t) + '<small>' + esc(it.c.corto) + '</small></dt><dd>' + it.d + '</dd></div>'; }).join('');
      document.getElementById('glos').innerHTML = html || '<div class="g"><dd class="muted">Sin resultados.</dd></div>';
    }
    document.getElementById('buscar').addEventListener('input', filtrar);
    document.getElementById('glos-curso').addEventListener('change', filtrar);
    filtrar();
  }

  /* ---------- Biblioteca ---------- */
  function vistaBiblioteca() {
    var ref = (window.ECO && window.ECO.referencias) || [];
    var libros = (window.ECO && window.ECO.libros) || [];
    function cuenta(id) {
      var n = { temas: 0, tarjetas: 0, preguntas: 0 }, re = new RegExp('\\b' + (libros.filter(function (l) { return l.id === id; })[0] || {}).corto + '\\b');
      CURSOS.forEach(function (c) {
        c.criterios.forEach(function (cr) { (cr.temas || []).forEach(function (t) { if (re.test(t.fuente || '')) n.temas++; }); });
        c.tarjetas.forEach(function (t) { if (re.test(t.fuente)) n.tarjetas++; });
        c.preguntas.forEach(function (p) { if (re.test(p.f || '')) n.preguntas++; });
      });
      return n;
    }
    app.innerHTML = '<section class="chead"><span class="eyebrow">Fuentes</span><h1>Biblioteca</h1><p class="muted">El contenido de la plataforma se basa en estos libros. Cada tema, tarjeta y pregunta indica el libro y la página o capítulo de donde sale.</p></section>' +
      '<section class="panel"><h3>Libros del curso</h3>' + (libros.length ? '<div class="libros">' + libros.map(function (l) {
        var n = cuenta(l.id);
        return '<div class="libro"><span class="lomo"></span><div><b>' + esc(l.titulo) + '</b><br><span class="muted">' + esc(l.autor) + '</span><br><span style="font-size:.9rem">' + esc(l.detalle) + '</span><br><span class="mono muted" style="font-size:.8rem">Citado como «' + esc(l.corto) + '» en ' + n.temas + ' temas · ' + n.tarjetas + ' tarjetas · ' + n.preguntas + ' preguntas</span></div></div>';
      }).join('') + '</div>' : '<div class="vacio"><b>Todavía no hay libros cargados.</b></div>') + '</section>' +
      '<section class="panel"><h3>Otros textos de consulta</h3><p class="muted" style="font-size:.95rem">Referencias clásicas para ampliar un tema; no son la base del contenido de la plataforma.</p><div class="libros">' + ref.map(function (r) {
        return '<div class="libro"><span class="lomo"></span><div><b>' + esc(r.titulo) + '</b><br><span class="muted">' + esc(r.autor) + '</span><br><span style="font-size:.9rem">' + esc(r.uso) + '</span></div></div>';
      }).join('') + '</div></section>' +
      '<section class="panel"><h3>Respaldo del progreso</h3><p class="muted" style="font-size:.95rem">El progreso se guarda solo en este navegador. Para pasarlo a otro dispositivo, copia el código y pégalo allá.</p>' +
      '<div class="row"><button class="btn" data-act="copiar">Copiar código de progreso</button><span id="copiado" class="muted mono" style="font-size:.85rem"></span></div>' +
      '<textarea id="respaldo" placeholder="Pega aquí un código de progreso para restaurarlo"></textarea>' +
      '<div class="row"><button class="btn" data-act="restaurar">Restaurar progreso</button><button class="btn ghost" data-act="borrar">Borrar todo el progreso</button><span id="msg-resp" class="muted" style="font-size:.9rem"></span></div></section>';
  }

  /* ---------- Eventos ---------- */
  var confirmarBorrado = false;
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'voltear') { ses.vuelta = true; pintarTarjeta(); }
    else if (act === 'calif') calificar(+b.dataset.g);
    else if (act === 'leido') {
      var id = b.dataset.id; if (S.leidos[id]) delete S.leidos[id]; else S.leidos[id] = Date.now(); guardar();
      var det = b.closest('details'); var open = det && det.open; var r = ruta(); vistaCurso(r.curso, r.tab);
      var d2 = document.querySelector('[data-tema="' + id + '"]'); if (d2 && open) { d2.open = true; d2.scrollIntoView({ block: 'nearest' }); }
    }
    else if (act === 'ir-crit') { critPreferido = b.dataset.crit; }
    else if (act === 'resp') {
      if (ses.tipo === 'preguntas') {
        var it = ses.items[ses.pos]; if (it.resp !== null) return;
        it.resp = +b.dataset.oi; var ok = it.resp === it.p.a; if (ok) ses.aciertos++; registrar(it.p, ok); pintarPregunta();
      } else if (ses.tipo === 'sim') { ses.items[ses.pos].resp = +b.dataset.oi; pintarSim(); }
    }
    else if (act === 'sig-p') { ses.pos++; pintarPregunta(); window.scrollTo(0, 0); }
    else if (act === 'reiniciar-p') iniciarPreguntas(ses.curso, ses.crit, false);
    else if (act === 'reiniciar-p-falladas') iniciarPreguntas(ses.curso, ses.crit, true);
    else if (act === 'sim-ini') iniciarSimulacro(ruta().curso, +b.dataset.n);
    else if (act === 'sim-sig') { ses.pos++; pintarSim(); window.scrollTo(0, 0); }
    else if (act === 'sim-ant') { ses.pos = Math.max(0, ses.pos - 1); pintarSim(); }
    else if (act === 'sim-otra') pantallaSimulacro(ruta().curso);
    else if (act === 'copiar') {
      var txt = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      var out = document.getElementById('copiado');
      var ta = document.getElementById('respaldo');
      try {
        navigator.clipboard.writeText(txt).then(function () { out.textContent = 'Copiado (' + Math.round(txt.length / 1024) + ' KB)'; }, function () { ta.value = txt; ta.select(); out.textContent = 'Selecciona y copia el texto de abajo'; });
      } catch (err) { ta.value = txt; ta.select(); out.textContent = 'Selecciona y copia el texto de abajo'; }
    }
    else if (act === 'restaurar') {
      var msg = document.getElementById('msg-resp');
      try {
        var o = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('respaldo').value.trim()))));
        var nb = base(); for (var k in nb) if (o[k]) nb[k] = o[k]; S = nb; guardar(); msg.textContent = 'Progreso restaurado.'; actualizarBadge();
      } catch (err) { msg.textContent = 'El código no es válido. Cópialo completo desde «Copiar código de progreso».'; }
    }
    else if (act === 'borrar') {
      var m = document.getElementById('msg-resp');
      if (!confirmarBorrado) { confirmarBorrado = true; b.textContent = 'Pulsa otra vez para confirmar'; m.textContent = 'Se borrarán tarjetas, respuestas, notas y simulacros.'; return; }
      S = base(); guardar(); confirmarBorrado = false; b.textContent = 'Borrar todo el progreso'; m.textContent = 'Progreso borrado.'; actualizarBadge();
    }
  });
  app.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'f-crit-t' || id === 'f-modo') iniciarTarjetas(ses.curso, document.getElementById('f-crit-t').value, document.getElementById('f-modo').value);
    else if (id === 'f-crit-p' || id === 'f-falladas') iniciarPreguntas(ses.curso, document.getElementById('f-crit-p').value, document.getElementById('f-falladas').checked);
  });
  var tNota = null;
  app.addEventListener('input', function (e) {
    var id = e.target.dataset && e.target.dataset.nota; if (!id) return;
    S.notas[id] = e.target.value; clearTimeout(tNota); tNota = setTimeout(guardar, 400);
  });
  document.addEventListener('keydown', function (e) {
    if (!ses || (ses.tipo !== 'tarjetas' && ses.tipo !== 'repaso')) return;
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
    if (!document.getElementById('fc')) return;
    if (!ses.vuelta && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ses.vuelta = true; pintarTarjeta(); }
    else if (ses.vuelta && /^[1-4]$/.test(e.key)) calificar(+e.key - 1);
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
